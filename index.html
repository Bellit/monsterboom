<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Boom Monsters · Batalla de monstruos con bombas</title>
    <meta name="description" content="Boom Monsters: juego de batalla con bombas entre monstruos. Rompe bloques, recoge power-ups y sé el último en pie." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1a1726" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="game"></div>

    <main id="menu" class="screen">
      <h1>Boom<span>Monsters</span></h1>
      <p class="tagline">Batalla de monstruos con bombas · prototipo</p>
      <form id="menu-form">
        <label>Jugadores
          <select name="players">
            <option>2</option><option>3</option><option selected>4</option>
            <option>5</option><option>6</option><option>7</option><option>8</option>
          </select>
        </label>
        <label>Dificultad de los rivales
          <select name="difficulty">
            <option value="easy">Fácil</option>
            <option value="normal" selected>Normal</option>
            <option value="hard">Difícil</option>
          </select>
        </label>
        <label>Partida
          <select name="rounds">
            <option value="1">Una ronda</option>
            <option value="2" selected>Al mejor de 3</option>
            <option value="3">Al mejor de 5</option>
          </select>
        </label>
        <label>Tiempo por ronda
          <select name="time">
            <option value="60">1:00</option>
            <option value="90">1:30</option>
            <option value="120" selected>2:00</option>
            <option value="180">3:00</option>
          </select>
        </label>
        <button id="start" class="primary" type="submit">¡A jugar!</button>
      </form>
      <p class="help keys">Flechas o WASD para moverte · Espacio para poner bomba · Esc para pausar</p>
      <p class="help">Cuando se acaba el tiempo empieza la lluvia de bombas.</p>
    </main>

    <section id="pause" class="screen dim" hidden aria-label="Pausa">
      <h2>Pausa</h2>
      <div class="actions">
        <button id="resume" class="primary" type="button">Continuar</button>
        <button id="quit" type="button">Salir al menú</button>
      </div>
    </section>

    <section id="result" class="screen dim" hidden aria-live="polite">
      <h2 id="result-title"></h2>
      <p id="result-text"></p>
      <div id="result-actions" class="actions"></div>
    </section>

    <div id="touch" hidden>
      <div id="touch-pad" aria-label="Mover"><div id="touch-knob"></div></div>
      <button id="touch-bomb" type="button" aria-label="Poner bomba">💣</button>
      <button id="touch-pause" type="button" aria-label="Pausa">❚❚</button>
    </div>

    <div id="rotate" aria-hidden="true">Gira el móvil para jugar en horizontal ↻</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
